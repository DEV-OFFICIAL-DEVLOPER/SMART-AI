
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART AI - Your AI Assistant</title>
  <style>
    body {
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
    h1 { color: #a78bfa; }
    #chat {
      max-width: 600px;
      margin: 30px auto;
      text-align: left;
      min-height: 180px;
    }
    input {
      padding: 14px;
      width: 65%;
      border-radius: 10px;
      border: none;
    }
    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #a78bfa;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>SMART AI 🤖</h1>
  <p>Your Personal AI Assistant</p>
  <div id="chat"></div>
  <input id="question" placeholder="Ask SMART AI...">
  <button onclick="send()">Send</button>
  <script>
    function send() {
      const input = document.getElementById("question");
      const chat = document.getElementById("chat");
      if (!input.value.trim()) return;
      const message = document.createElement("p");
      message.textContent = "You: " + input.value;
      chat.appendChild(message);
      const reply = document.createElement("p");
      reply.textContent = "SMART AI: AI connection coming soon!";
      chat.appendChild(reply);
      input.value = "";
    }
  </script>
</body>
</html>
