<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="fvyHei19OwJu-pSzZs60e8DVUPvyNF1crC2zTJkUH_Q" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMART AI — Your AI Assistant</title>
  <style>
    :root{color-scheme:dark;--bg:#111214;--panel:#191b1e;--line:#303238;--text:#f2f3f5;--muted:#a5a7ae;--accent:#9c8cff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    .app{display:flex;height:100dvh;min-height:450px}.sidebar{width:252px;background:#18191c;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:22px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.4px;padding:4px 9px}.logo{width:35px;height:35px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#8066ff,#49c7df);font-size:19px;color:white}
    button{font:inherit;cursor:pointer}.new-chat{border:1px solid #41434a;background:#25262b;color:var(--text);border-radius:12px;padding:13px 14px;text-align:left;font-weight:600}.new-chat:hover{background:#303138}.side-caption{font-size:11px;letter-spacing:1.5px;color:#8b8e96;text-transform:uppercase;padding:0 10px}.side-note{font-size:13px;line-height:1.5;color:var(--muted);padding:0 10px}.side-footer{margin-top:auto;border-top:1px solid var(--line);padding:17px 10px 3px;color:#989aa2;font-size:12px}
    .main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:70px;flex-shrink:0;border-bottom:1px solid #24262a;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top-title{font-weight:700;font-size:16px}.status{display:flex;align-items:center;gap:7px;color:#adb0b8;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#63d4a0;box-shadow:0 0 9px #63d4a077}
    .messages{flex:1;overflow-y:auto;padding:34px 24px 16px}.inner{max-width:820px;margin:0 auto}.welcome{padding-top:min(15vh,135px);text-align:center}.welcome-icon{width:68px;height:68px;margin:0 auto 20px;border-radius:21px;background:linear-gradient(135deg,#7d69ff,#43bfd7);display:grid;place-items:center;font-size:32px;box-shadow:0 10px 35px #7864fa35}.welcome h1{font-size:clamp(27px,4vw,40px);letter-spacing:-1px;margin:0 0 12px}.welcome p{color:var(--muted);font-size:15px;margin:0}.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;max-width:560px;margin:32px auto 0}.prompt{background:#1d1f23;border:1px solid #35373e;border-radius:14px;padding:16px;text-align:left;color:#e3e4e8}.prompt:hover{border-color:#8275c9;background:#26252e}.prompt small{display:block;color:#999ba4;margin-top:5px}
    .message{display:flex;gap:13px;margin:0 0 24px;align-items:flex-start}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:10px;background:linear-gradient(135deg,#8269f8,#4dbacb);display:grid;place-items:center;font-size:15px;font-weight:700}.message.user{justify-content:flex-end}.message.user .avatar{order:2;background:#373942}.bubble{max-width:min(90%,680px);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px;padding:4px 0}.user .bubble{background:#292b30;padding:11px 16px;border-radius:16px}.message.error .bubble{color:#ffaaaa}
    .composer-area{padding:12px 24px 19px;background:linear-gradient(0deg,var(--bg) 80%,transparent)}.composer-wrap{max-width:820px;margin:auto}.composer{display:flex;gap:12px;align-items:flex-end;background:#23252a;border:1px solid #44464d;border-radius:19px;padding:12px;box-shadow:0 10px 30px #0002}.composer:focus-within{border-color:#8477b8}textarea{flex:1;resize:none;max-height:160px;min-height:27px;background:transparent;color:var(--text);border:0;outline:0;font:inherit;font-size:14px;line-height:1.5;padding:3px 5px}textarea::placeholder{color:#9799a3}.send{width:37px;height:37px;border:0;border-radius:12px;background:#a395ff;color:#16151e;font-size:20px;font-weight:700;flex-shrink:0}.send:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;color:#777a83;font-size:11px;margin:10px 0 0}.mobile-menu{display:none;border:0;background:none;color:white;font-size:24px}
    @media(max-width:700px){.sidebar{display:none;position:absolute;z-index:3;inset:0 auto 0 0;box-shadow:20px 0 80px #0009}.sidebar.open{display:flex}.mobile-menu{display:block}.topbar{padding:0 17px;height:60px}.messages{padding:25px 16px}.composer-area{padding:9px 12px 13px}.prompts{grid-template-columns:1fr}.welcome{padding-top:8vh}.welcome h1{font-size:29px}.status{font-size:11px}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">✦</div> SMART AI</div>
    <button class="new-chat" id="newChat">＋ &nbsp; New chat</button>
    <div><div class="side-caption">Your workspace</div><p class="side-note">Ask questions, brainstorm ideas, write stories, and learn something new.</p></div>
    <div class="side-footer">✦ SMART AI<br>Powered by AI</div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:13px"><button class="mobile-menu" id="menu" aria-label="Open menu">☰</button><span class="top-title">SMART AI <span style="color:#858790;font-weight:400">/ Assistant</span></span></div><span class="status"><span class="dot"></span> Ready to help</span></header>
    <section class="messages" id="messages" aria-live="polite"><div class="inner" id="conversation"><div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>How can I help you today?</h1><p>Your ideas, questions, and creativity start here.</p><div class="prompts"><button class="prompt" data-prompt="Explain something interesting about space">🚀 Explore space<small>Learn something fascinating</small></button><button class="prompt" data-prompt="Give me creative ideas for a YouTube video">💡 Creative ideas<small>Find your next big idea</small></button><button class="prompt" data-prompt="Help me learn JavaScript as a beginner">💻 Learn to code<small>Build new skills</small></button><button class="prompt" data-prompt="Write a short funny story">✍️ Write a story<small>Make something original</small></button></div></div></div></section>
    <div class="composer-area"><div class="composer-wrap"><form class="composer" id="chatForm"><textarea id="question" rows="1" placeholder="Message SMART AI..." aria-label="Your message"></textarea><button class="send" id="send" type="submit" aria-label="Send message">↑</button></form><p class="hint">SMART AI can make mistakes. Check important information.</p></div></div>
  </main>
</div>
<script>
  const API_URL = "https://smart-ai-backend.umeshsharma15775.workers.dev/";
  const conversation = document.getElementById("conversation");
  const messages = document.getElementById("messages");
  const input = document.getElementById("question");
  const sendButton = document.getElementById("send");
  let busy = false;
  let chatId = 0;

  function addMessage(role, text, isError = false) {
    const row = document.createElement("div");
    row.className = "message " + role + (isError ? " error" : "");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "U" : "✦";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.append(avatar, bubble);
    conversation.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return { row, bubble };
  }

  async function sendMessage(value) {
    const text = (value ?? input.value).trim();
    if (!text || busy) return;
    document.getElementById("welcome")?.remove();
    addMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    const answer = addMessage("assistant", "Thinking...");
    busy = true;
    sendButton.disabled = true;
    const currentChat = chatId;
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      if (currentChat === chatId) answer.bubble.textContent = data.reply || "No response received.";
    } catch (error) {
      console.error(error);
      if (currentChat === chatId) {
        answer.row.classList.add("error");
        answer.bubble.textContent = "Connection error. Please try again.";
      }
    } finally {
      busy = false;
      sendButton.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  }

  document.getElementById("chatForm").addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });
  document.querySelectorAll("[data-prompt]").forEach((button) => {
    button.addEventListener("click", () => sendMessage(button.dataset.prompt));
  });
  document.getElementById("newChat").addEventListener("click", () => {
    chatId++;
    conversation.innerHTML = '<div class="welcome" id="welcome"><div class="welcome-icon">✦</div><h1>How can I help you today?</h1><p>Start a fresh conversation.</p></div>';
    document.getElementById("sidebar").classList.remove("open");
    input.focus();
  });
  document.getElementById("menu").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
  });
</script>
</body>
</html>
