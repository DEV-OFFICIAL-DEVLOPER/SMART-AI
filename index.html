
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SMART AI - AI assistant for questions, writing, learning and coding.">
<meta name="google-site-verification" content="fvyHei19OwJu-pSzZs60e8DVUPvyNF1crC2zTJkUH_Q">
<title>SMART AI - Your AI Assistant</title>
<style>
:root {
  color-scheme: dark;
  --bg:#212121; --side:#171717; --panel:#303030;
  --text:#f5f5f5; --muted:#aaa; --border:#424242;
  --accent:#10a37f; --hover:#383838;
}
body.light {
  color-scheme:light;
  --bg:#fff; --side:#f7f7f8; --panel:#eee;
  --text:#202123; --muted:#666; --border:#ddd;
  --accent:#087f63; --hover:#e9e9e9;
}
* {box-sizing:border-box}
body {
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,textarea {font:inherit}
button {cursor:pointer}
.app {height:100dvh;display:flex;overflow:hidden}
.sidebar {
  width:265px;flex-shrink:0;background:var(--side);
  display:flex;flex-direction:column;padding:14px;gap:12px;
  border-right:1px solid var(--border);
}
.brand {font-size:20px;font-weight:bold;padding:12px 8px}
.brand span {color:var(--accent)}
.btn {
  color:var(--text);background:transparent;
  border:1px solid var(--border);border-radius:10px;
  padding:11px;text-align:left;
}
.btn:hover,.history-item:hover {background:var(--hover)}
.new-chat {width:100%}
.section-label {
  font-size:11px;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;padding:8px 4px;
}
.history {overflow:auto;display:flex;flex-direction:column;gap:4px}
.history-item {
  color:var(--text);background:transparent;border:0;border-radius:8px;
  padding:10px;text-align:left;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;width:100%;font-size:13px;
}
.history-item.active {background:var(--hover)}
.side-bottom {margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.main {flex:1;min-width:0;display:flex;flex-direction:column}
.topbar {
  min-height:58px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:10px 20px;
}
.top-actions {display:flex;gap:8px;align-items:center}
.icon-btn {
  color:var(--text);background:transparent;border:1px solid var(--border);
  border-radius:9px;padding:9px;
}
.chat-scroll {flex:1;overflow:auto;padding:24px 18px}
.chat-inner {max-width:790px;margin:auto}
.welcome {text-align:center;padding:10vh 0 25px}
.welcome h1 {font-size:clamp(25px,4vw,36px)}
.welcome p {color:var(--muted)}
.spark {color:var(--accent);font-size:36px}
.prompts {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;margin:30px auto;max-width:570px;
}
.prompt {
  background:var(--bg);border:1px solid var(--border);
  color:var(--text);border-radius:12px;text-align:left;padding:15px;
}
.prompt:hover {background:var(--hover)}
.prompt small {display:block;color:var(--muted);margin-top:6px}
.message {display:flex;gap:12px;margin:24px 0;align-items:flex-start}
.avatar {
  width:31px;height:31px;flex:0 0 31px;border-radius:50%;
  display:grid;place-items:center;background:var(--accent);color:white;
  font-weight:bold;
}
.bubble {flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7}
.bubble img {display:block;max-width:min(100%,360px);max-height:300px;object-fit:contain;margin-top:10px;border-radius:12px}
.message-tools {display:flex;gap:6px;margin-top:8px}
.message-tools button {background:transparent;color:var(--muted);border:0;padding:5px}
.message-tools button:hover {color:var(--text)}
.composer-area {padding:12px 18px 18px}
.composer-wrap {max-width:790px;margin:auto}
.attachment {display:none;padding:8px;color:var(--muted);font-size:13px}
.attachment img {max-width:100px;max-height:90px;border-radius:8px;display:block;margin-top:6px}
.composer {
  border:1px solid var(--border);border-radius:20px;padding:10px;
  display:flex;align-items:flex-end;gap:8px;background:var(--panel);
}
.composer:focus-within {border-color:var(--accent)}
textarea {
  flex:1;min-width:0;resize:none;max-height:180px;min-height:28px;
  border:0;outline:0;background:transparent;color:var(--text);
  line-height:1.5;padding:6px;
}
textarea::placeholder {color:var(--muted)}
.send {
  border:0;border-radius:12px;background:var(--accent);color:white;
  font-size:20px;width:38px;height:38px;flex-shrink:0;
}
.send:disabled {opacity:.5}
.disclaimer {text-align:center;color:var(--muted);font-size:11px;margin:9px 0 0}
.small-status {font-size:12px;color:var(--muted)}
.mobile-menu {display:none}
@media(max-width:700px) {
  .sidebar {display:none;position:absolute;z-index:5;inset:0 auto 0 0;box-shadow:0 0 0 100vmax #0008}
  .sidebar.open {display:flex}
  .mobile-menu {display:inline-block}
  .topbar {padding:10px}
  .top-actions {gap:4px}
  .chat-scroll {padding:15px 12px}
  .composer-area {padding:8px 9px 12px}
  .prompts {grid-template-columns:1fr}
  .welcome {padding-top:5vh}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span>✦</span> SMART AI</div>
    <button class="btn new-chat" id="newChat">＋ New chat</button>
    <div class="section-label">Recent chats</div>
    <div class="history" id="historyList"></div>
    <div class="side-bottom">
      <button class="btn" id="exportBtn" style="width:100%">⇩ Export current chat</button>
      <button class="btn" id="clearBtn" style="width:100%;margin-top:8px">Clear current chat</button>
      <p class="small-status">Your chats are saved in this browser.</p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-actions">
        <button class="icon-btn mobile-menu" id="menu" aria-label="Open menu">☰</button>
        <strong>SMART AI</strong>
        <span class="small-status">/ Assistant</span>
      </div>
      <div class="top-actions">
        <span class="small-status" id="status">Ready</span>
        <button class="icon-btn" id="themeBtn" title="Toggle dark/light mode">☼ Theme</button>
      </div>
    </header>

    <section class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="conversation"></div>
    </section>

    <div class="composer-area">
      <div class="composer-wrap">
        <div class="attachment" id="attachment"></div>
        <form class="composer" id="chatForm">
          <button class="icon-btn" type="button" id="uploadBtn" title="Choose image">＋</button>
          <input type="file" id="imageInput" accept="image/*" hidden>
          <textarea id="question" rows="1" placeholder="Message SMART AI..." aria-label="Message SMART AI"></textarea>
          <button class="icon-btn" type="button" id="voiceBtn" title="Voice input">🎙</button>
          <button class="send" id="send" type="submit" aria-label="Send">↑</button>
        </form>
        <p class="disclaimer">AI can make mistakes. Check important information.</p>
      </div>
    </div>
  </main>
</div>

<script>
const API_URL = "https://smart-ai-backend.umeshsharma15775.workers.dev/";
const HISTORY_KEY = "smart_ai_chat_history";
const CURRENT_KEY = "smart_ai_current_chat_id";
const THEME_KEY = "smart_ai_theme";

const $ = id => document.getElementById(id);
const conversation = $("conversation");
const chatScroll = $("chatScroll");
const input = $("question");
const sendButton = $("send");
let busy = false;
let selectedImage = null;
let recognition = null;

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,9);
}
function getHistory() {
  try {
    const data = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch { return []; }
}
function putHistory(history) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch { alert("Browser storage is full. Export or clear old chats."); }
}
let chatId = localStorage.getItem(CURRENT_KEY) || newId();
localStorage.setItem(CURRENT_KEY, chatId);

function currentChat(create = true) {
  const history = getHistory();
  let chat = history.find(c => c.id === chatId);
  if (!chat && create) {
    chat = {id:chatId, title:"New chat", updatedAt:Date.now(), messages:[]};
    history.unshift(chat);
    putHistory(history);
  }
  return chat;
}
function updateChat(role, text) {
  const history = getHistory();
  let chat = history.find(c => c.id === chatId);
  if (!chat) {
    chat = {id:chatId,title:"New chat",updatedAt:Date.now(),messages:[]};
    history.unshift(chat);
  }
  chat.messages.push({role,text,at:Date.now()});
  if (role === "user" && chat.title === "New chat") {
    chat.title = text.slice(0,55);
  }
  chat.updatedAt = Date.now();
  putHistory(history);
  renderHistory();
}
function renderHistory() {
  const list = $("historyList");
  list.replaceChildren();
  const history = getHistory().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if (!history.length) {
    const p = document.createElement("p");
    p.className = "small-status";
    p.textContent = "No chats yet";
    list.appendChild(p);
    return;
  }
  history.forEach(chat => {
    const btn = document.createElement("button");
    btn.className = "history-item" + (chat.id === chatId ? " active" : "");
    btn.textContent = chat.title || "New chat";
    btn.title = btn.textContent;
    btn.addEventListener("click",()=>openChat(chat.id));
    list.appendChild(btn);
  });
}
function scrollBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }

function addMessage(role, text, options = {}) {
  const row = document.createElement("div");
  row.className = "message " + role;
  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "✦";
  const content = document.createElement("div");
  content.className = "bubble";
  content.textContent = text;
  row.append(avatar,content);

  if (options.imageUrl) {
    const img = document.createElement("img");
    img.src = options.imageUrl;
    img.alt = "Selected attachment preview";
    content.appendChild(img);
  }
  conversation.appendChild(row);

  if (role === "assistant" && !options.noTools) {
    const tools = document.createElement("div");
    tools.className = "message-tools";
    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.addEventListener("click",async()=>{
      try { await navigator.clipboard.writeText(text); copy.textContent = "Copied"; }
      catch { alert("Copy not supported here. Select the text and copy it."); }
    });
    tools.appendChild(copy);
    content.appendChild(tools);
  }
  scrollBottom();
  return {row,content};
}
function welcome() {
  conversation.replaceChildren();
  const box = document.createElement("div");
  box.className = "welcome";
  box.innerHTML = `
    <div class="spark">✦</div>
    <h1>What can I help with?</h1>
    <p>Ask anything, learn something new, or start creating.</p>
    <div class="prompts">
      <button class="prompt" data-prompt="Explain space in simple words">🚀 Explore space<small>Discover something new</small></button>
      <button class="prompt" data-prompt="Give me five funny YouTube Shorts ideas">💡 Video ideas<small>Find your next idea</small></button>
      <button class="prompt" data-prompt="Teach me JavaScript as a beginner with an example">💻 Learn coding<small>Start programming</small></button>
      <button class="prompt" data-prompt="Write a short original funny story">✍️ Write a story<small>Create something fun</small></button>
    </div>`;
  conversation.appendChild(box);
}
function openChat(id) {
  const chat = getHistory().find(c => c.id === id);
  if (!chat) return;
  chatId = id;
  localStorage.setItem(CURRENT_KEY,chatId);
  conversation.replaceChildren();
  if (!chat.messages || !chat.messages.length) welcome();
  else chat.messages.forEach(m => {
    if (m.role === "user" || m.role === "assistant") addMessage(m.role,m.text,{noTools:false});
  });
  renderHistory();
  $("sidebar").classList.remove("open");
  scrollBottom();
}
function startNewChat() {
  chatId = newId();
  localStorage.setItem(CURRENT_KEY,chatId);
  welcome();
  renderHistory();
  input.focus();
}
async function sendMessage(value) {
  const text = (value ?? input.value).trim();
  if ((!text && !selectedImage) || busy) return;

  if (selectedImage) {
    alert("Image preview works, but your current text-only backend cannot analyse images yet. The image will not be sent to the AI.");
    if (!text) return;
  }

  $("conversation").querySelector(".welcome")?.remove();
  addMessage("user",text);
  updateChat("user",text);
  input.value = "";
  input.style.height = "auto";
  selectedImage = null;
  $("attachment").style.display = "none";
  $("attachment").replaceChildren();

  const answer = addMessage("assistant","Thinking...");
  busy = true;
  sendButton.disabled = true;
  $("status").textContent = "Thinking…";

  try {
    const response = await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:text})
    });
    let data;
    try { data = await response.json(); }
    catch { throw new Error("The server returned an invalid response."); }
    if (!response.ok) throw new Error(data.error || "Request failed");
    const reply = data.reply || "No response received.";
    answer.content.textContent = reply;
    const tools = document.createElement("div");
    tools.className = "message-tools";
    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.addEventListener("click",async()=>{
      try { await navigator.clipboard.writeText(reply); copy.textContent = "Copied"; }
      catch { alert("Please select and copy the reply manually."); }
    });
    tools.appendChild(copy);
    answer.content.appendChild(tools);
    updateChat("assistant",reply);
  } catch(error) {
    console.error(error);
    answer.row.classList.add("error");
    answer.content.textContent = "Connection error. Please try again. Check your internet and backend.";
  } finally {
    busy = false;
    sendButton.disabled = false;
    $("status").textContent = "Ready";
    scrollBottom();
    input.focus();
  }
}

$("chatForm").addEventListener("submit",e=>{
  e.preventDefault();
  sendMessage();
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,180)+"px";
});
document.addEventListener("click",e=>{
  const prompt = e.target.closest("[data-prompt]");
  if(prompt) sendMessage(prompt.dataset.prompt);
});
$("newChat").addEventListener("click",startNewChat);
$("menu").addEventListener("click",()=>$("sidebar").classList.toggle("open"));

function setTheme(theme) {
  document.body.classList.toggle("light",theme==="light");
  localStorage.setItem(THEME_KEY,theme);
  $("themeBtn").textContent = theme==="light" ? "☾ Dark mode" : "☼ Light mode";
}
setTheme(localStorage.getItem(THEME_KEY)||"dark");
$("themeBtn").addEventListener("click",()=>{
  setTheme(document.body.classList.contains("light")?"dark":"light");
});

$("uploadBtn").addEventListener("click",()=>$("imageInput").click());
$("imageInput").addEventListener("change",()=>{
  const file = $("imageInput").files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")) {
    alert("Please select an image file.");
    return;
  }
  if(file.size>5*1024*1024) {
    alert("Please choose an image smaller than 5 MB.");
    return;
  }
  selectedImage = file;
  const area = $("attachment");
  area.replaceChildren();
  area.style.display="block";
  const label = document.createElement("span");
  label.textContent = "Selected: " + file.name;
  const img = document.createElement("img");
  img.src = URL.createObjectURL(file);
  img.alt = "Image preview";
  area.append(label,img);
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = e => {
    input.value += (input.value ? " " : "") + e.results[0][0].transcript;
    input.dispatchEvent(new Event("input"));
  };
  recognition.onerror = () => $("status").textContent = "Voice input unavailable";
  recognition.onend = () => $("status").textContent = "Ready";
  $("voiceBtn").addEventListener("click",()=>{
    try { $("status").textContent="Listening…"; recognition.start(); }
    catch { $("status").textContent="Voice already active"; }
  });
} else {
  $("voiceBtn").addEventListener("click",()=>{
    alert("Voice input is not supported by this browser. Try a supported browser and allow microphone access.");
  });
}

$("exportBtn").addEventListener("click",()=>{
  const chat = currentChat(false);
  if(!chat || !chat.messages?.length) {
    alert("There are no messages to export in this chat.");
    return;
  }
  const content = chat.messages.map(m=>
    (m.role==="user"?"You":"SMART AI")+":\n"+m.text
  ).join("\n\n");
  const blob = new Blob([content],{type:"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href=url;
  a.download="smart-ai-chat.txt";
  a.click();
  URL.revokeObjectURL(url);
});
$("clearBtn").addEventListener("click",()=>{
  if(!confirm("Delete this conversation from this browser?")) return;
  putHistory(getHistory().filter(c=>c.id!==chatId));
  startNewChat();
});

const existing = getHistory().find(c=>c.id===chatId);
if(existing) openChat(chatId);
else welcome();
renderHistory();
</script>
</body>
</html>
