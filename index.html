
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART AI - Your AI Assistant</title>
  <style>
    body {
      background: #171717;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
    }
    h1 { color: #a78bfa; }
    #chat {
      max-width: 600px;
      margin: 30px auto;
      text-align: left;
      min-height: 180px;
    }
    input {
      padding: 14px;
      width: 65%;
      border-radius: 10px;
      border: none;
    }
    button {
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #a78bfa;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>SMART AI 🤖</h1>
  <p>Your Personal AI Assistant</p>
  <div id="chat"></div>
  <input id="question" placeholder="Ask SMART AI...">
  <button onclick="send()">Send</button>
  <script>
   
async function send() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const text = input.value.trim();

  if (!text) return;

  const message = document.createElement("p");
  message.textContent = "You: " + text;
  chat.appendChild(message);

  const reply = document.createElement("p");
  reply.textContent = "SMART AI: Soch raha hoon...";
  chat.appendChild(reply);

  input.value = "";

  try {
    const response = await fetch(
      "https://smart-ai-backend.umeshsharma15775.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: text })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed");
    }

    reply.textContent = "SMART AI: " + data.reply;
  } catch (error) {
    reply.textContent =
      "SMART AI: Connection error. Please try again.";
    console.error(error);
  }
}

  </script>
</body>
</html>
