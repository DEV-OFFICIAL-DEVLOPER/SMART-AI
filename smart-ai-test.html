<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART AI Account Test</title>
</head>
<body>
  <h2>SMART AI Account Test</h2>

  <button onclick="testSignup()">Test Signup</button>
  <button onclick="testLogin()">Test Login</button>

  <pre id="result">Choose a test.</pre>

  <script>
    const API = "https://smart-ai-backend.umeshsharma15775.workers.dev";

    const testAccount = {
      email: "smartaitest123@example.com",
      password: "TestPass123!"
    };

    async function sendTest(path, body) {
      const output = document.getElementById("result");
      output.textContent = "Testing...";

      try {
        const response = await fetch(API + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        output.textContent =
          "Status: " + response.status +
          "\nResult: " + JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = "Request failed: " + error.message;
      }
    }

    function testSignup() {
      sendTest("/auth/signup", testAccount);
    }

    function testLogin() {
      sendTest("/auth/login", testAccount);
    }
  </script>
</body>
</html>
